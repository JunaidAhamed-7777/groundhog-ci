name: Groundhog quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run parser, retrieval, and adversarial tests
        run: npm test
      - name: Exercise UI state transitions without a browser
        run: npm run test:ui-state
      - name: Build static application
        run: npm run build
      - name: Retain build for review
        uses: actions/upload-artifact@v4
        with:
          name: groundhog-static
          path: dist
          retention-days: 7

  open-model-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache pinned open-weight model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: minilm-q8-751bff37182d3f1213fa05d7196b954e230abad9
      - name: Exercise real model and tokenizer
        run: npm run test:model
      - name: Exercise official CPU WebAssembly runtime
        run: npm run test:wasm
      - name: Re-run evaluation without changing frozen thresholds
        run: npm run evaluate -- --verify
      - name: Verify expanded corpus on native CPU
        run: node tools/stress-evaluate.mjs --verify
      - name: Verify expanded corpus on CPU WebAssembly
        run: node tools/stress-evaluate.mjs --verify-wasm
      - name: Retain evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evidence
          path: evidence/
          retention-days: 7
